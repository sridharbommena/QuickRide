spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: driver-service
              uri: lb://DRIVER-SERVICE
              predicates:
                - Path=/api/drivers/**

            - id: trip-service
              uri: lb://TRIP-SERVICE
              predicates:
                - Path=/api/trips/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/